version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: spendwise-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build: ./ml-service
    container_name: spendwise-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ml-service/.env

  backend:
    build: ./backend
    container_name: spendwise-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - ml-service
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/spendwise
      - ML_SERVICE_URL=http://ml-service:8000

  frontend:
    build: ./frontend
    container_name: spendwise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env

volumes:
  mongo-data:
